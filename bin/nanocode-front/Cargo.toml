[package]
name = "nanocode-front"
version = "0.0.0"
edition = "2024"
publish = false
license = "Apache-2.0"
repository = "https://github.com/nanocodexyz/nanocode"
description = "Static front for the nanocode CLI on Linux: answers --version itself, execs nanocode-exec beside it for exec when present, and execs nanocode-agent beside it for everything else"
autotests = false
autobenches = false

[workspace]

[[bin]]
name = "nanocode-front"
path = "src/main.rs"
test = false
bench = false

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
strip = "symbols"
codegen-units = 1

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
missing_const_for_fn = "warn"
use_self = "warn"
redundant_clone = "warn"
