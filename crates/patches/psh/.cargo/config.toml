[target.wasm32-unknown-unknown]
rustflags = ["-C", "target-feature=+simd128"]

# The standalone psh starts in a third of the time linked statically and not position
# independent: the dynamic loader's mappings and 24k relocations were most of
# `psh -c :` (D-startup, DECISIONS.md 2026-11-15). Only this workspace's builds take it;
# nanocode's own build does not read this file.
[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "target-feature=+crt-static", "-C", "relocation-model=static"]

[target.aarch64-unknown-linux-gnu]
rustflags = ["-C", "target-feature=+crt-static", "-C", "relocation-model=static"]
