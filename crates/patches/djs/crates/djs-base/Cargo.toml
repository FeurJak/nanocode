[package]
name = "djs-base"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true
description = "Makes djs-prelude's base snapshot (djs-prelude/base/) and checks that it is current."

[lib]
# No doctests (scripts/gate.py `targets` fails if one appears): none to compile (0197).
doctest = false

[[bin]]
name = "djs-base"
# No unit tests in the program (scripts/gate.py `targets` checks): no empty test binary (0197).
test = false
path = "src/main.rs"

# The features of the djs-core whose base djs-prelude embeds: djs-embed's (D2411, D3175).
# BUILD_HASH covers them, so djs-prelude refuses a base made with others.
[dependencies]
djs-core = { path = "../djs-core", default-features = false, features = ["full", "embed", "unicode"] }
