[package]
name = "djs-prelude"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true
description = "The base snapshot: djs-core's realm with the prelude installed, made by djs-base and checked in (D1321)."

[lib]
# No doctests (scripts/gate.py `targets` fails if one appears): none to compile (0197).
doctest = false

[features]
default = ["raw", "full", "unicode", "embed"]
# djs-core's features (D2411), for the djs-core the base image loads into: they must be
# those djs-base made the image with, which lib.rs checks by the build hash.
full = ["djs-core/full"]
# djs-core's `embed` (D3175): the base image has the builtins only Rust hosts get.
embed = ["djs-core/embed"]
unicode = ["djs-core/unicode", "regexp-unicode-props", "unicode-normalization"]
regexp-unicode-props = ["djs-core/regexp-unicode-props"]
unicode-normalization = ["djs-core/unicode-normalization"]
# `BASE`, the image as it is: native builds (copied per VM with no decode).
raw = []

# No build script: base/ holds the image djs-base makes (scripts/base.sh), so nothing here
# waits for djs-core's code generation, only its metadata.
[dependencies]
djs-core = { path = "../djs-core", default-features = false }
